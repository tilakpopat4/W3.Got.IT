[project]
name = "onewayguard-dashboard"
version = "0.1.0"
description = "OneWayGuard SOC Dashboard and backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "xgboost>=2.0",
    "pydantic>=2.0",
    "scapy>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.vercel]
entrypoint = "src.dashboard_api:app"
